# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100

    # Broadcaster de estados de las articulaciones
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controladores de brazo
    left_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      use_action: true
    right_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      use_action: true

    # Controladores de gripper
    left_gripper_controller:
      type: position_controllers/GripperActionController
      use_action: true
    right_gripper_controller:
      type: position_controllers/GripperActionController
      use_action: true

# =========================
# Parámetros por controlador
# =========================
left_joint_trajectory_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    command_interfaces: [position]
    state_interfaces: [position]
    use_action: true
    state_publish_rate: 50.0
    action_monitor_rate: 10.0

right_joint_trajectory_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    command_interfaces: [position]
    state_interfaces: [position]
    use_action: true
    state_publish_rate: 50.0
    action_monitor_rate: 10.0

left_gripper_controller:
  ros__parameters:
    joint: openarm_left_finger_joint1
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    use_action: true

right_gripper_controller:
  ros__parameters:
    joint: openarm_right_finger_joint1
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    use_action: true

# =========================
# Hardware fake
# =========================
ros2_control:
  ros__parameters:
    type: fake
    use_sim_time: true
    update_rate: 100
